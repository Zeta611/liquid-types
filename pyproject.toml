[project]
name = "liquid-types"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jay Lee", email = "jay.lee@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "lark[interegular]>=1.3.1",
]

[project.scripts]
liquid-types = "liquid_types:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
preset = "default"
python-version = "3.12"
